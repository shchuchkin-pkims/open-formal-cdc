# Author: Shchuchkin E. Yu. <shchuchkin-pkims@yandex.ru>
# Scalable multi-channel CDC array for structural and formal performance tests.
design:
  top: cdc_array
  files: [cdc_array.sv]
  params: {N: 16, W: 8, BUG: 0}

clocks:
  - {name: a, port: clk_a, period: 4}
  - {name: b, port: clk_b, period: 10}
resets:
  - {port: rst_a_n, active: low, clock: a}
  - {port: rst_b_n, active: low, clock: b}
inputs:
  - {port: inc, clock: a}

options:
  time_models: [ticks]
  timeout: 120

variants:
  base:
    expect: {gray_ptr_a_7_0: proven}
  small:
    params: {N: 4}
    expect: {gray_ptr_a_7_0: proven}
  large:
    params: {N: 64}
    expect: {gray_ptr_a_7_0: proven}
  binary:
    params: {BUG: 1}
    expect: {gray_ptr_a_7_0: cex}
  missing_stage:
    params: {BUG: 2}
    expect: {"ptr_a[7:0]->data_b[7:0]": no_scheme}
