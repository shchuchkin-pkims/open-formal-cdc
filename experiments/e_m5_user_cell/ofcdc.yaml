# Author: Shchuchkin E. Yu. <shchuchkin-pkims@yandex.ru>
# M5 inside a declared synchronizer cell and its full T-CELL JSON result.
design:
  top: user_cell_top
  files: [user_cell.sv]

clocks:
  - {name: a, port: clk_a}
  - {name: b, port: clk_b}
resets:
  - {port: rst_a_n, active: low, clock: a}
  - {port: rst_b_n, active: low, clock: b}
inputs:
  - {port: set_a, clock: a}

cells:
  - module: sync2
    clocks: {b: clk}
    inputs: {d: null}
    outputs: {q: b}
    through: [d]
    scheme: ndff
    resets: [{port: rst_n, active: low, clock: b}]

options:
  structural: true
  m5_checks: true
  time_models: [ticks, clk2ff]
  timeout: 60
