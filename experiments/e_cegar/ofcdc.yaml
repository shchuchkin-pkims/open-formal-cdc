# Author: Shchuchkin E. Yu. <shchuchkin-pkims@yandex.ru>
# One state cut creates a spurious counterexample in good; bad confirms it.
design:
  top: cegar
  files: [cegar.sv]
  params: {BAD: 0}

clocks:
  - {name: a, port: clk_a}
  - {name: b, port: clk_b}
resets:
  - {port: rst_a_n, active: low, clock: a}
  - {port: rst_b_n, active: low, clock: b}
inputs:
  - {port: data_in, clock: a}

checks:
  - name: stable
    template: en_stable
    data: data_q
    enable: cap
    clock: b
    cut: [dst_data_q]
    cut_mode: state

options:
  structural: false
  time_models: [ticks, clk2ff]
  timeout: 60

variants:
  good:
    params: {BAD: 0}
  bad:
    params: {BAD: 1}
