# Author: Shchuchkin E. Yu. <shchuchkin-pkims@yandex.ru>
# M5 for two stages packed into one attributed vector flip-flop.
design:
  top: attr_sync
  files: [attr_sync.sv]
  params: {STAGES: 2}

clocks:
  - {name: a, port: clk_a}
  - {name: b, port: clk_b}
resets:
  - {port: rst_a_n, active: low, clock: a}
  - {port: rst_b_n, active: low, clock: b}
inputs:
  - {port: set_a, clock: a}

options:
  structural: true
  m5_checks: true
  time_models: [ticks, clk2ff]
  timeout: 60

variants:
  base:
    expect: {m5_q: proven}
  three:
    params: {STAGES: 3}
    expect: {m5_sync_q_1: proven}
