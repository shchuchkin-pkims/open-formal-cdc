# Author: Shchuchkin E. Yu. <shchuchkin-pkims@yandex.ru>
# Functional M5 reconvergence: Gray is safe, paired sources invent combinations.
design:
  top: m5_convergence
  files: [m5_convergence.sv]
  params: {MODE: 0}

clocks:
  - {name: a, port: clk_a, period: 10}
  - {name: b, port: clk_b, period: 5}
resets:
  - {port: rst_a_n, active: low, clock: a}
  - {port: rst_b_n, active: low, clock: b}
inputs:
  - {port: inc, clock: a}

options:
  structural: true
  m5_checks: true
  clock_ratio: periods
  time_models: [ticks, clk2ff]
  timeout: 60

variants:
  base:
    expect: {conv_joined: proven, m5_conv_joined: proven,
             m5_q0: proven, m5_q1: proven}
  paired:
    params: {MODE: 1}
    expect: {conv_joined: cex, m5_conv_joined: cex,
             m5_q0: proven, m5_q1: proven}
