# Author: Shchuchkin E. Yu. <shchuchkin-pkims@yandex.ru>
# Example: data under a toggle handshake. Crossings and checks are found automatically:
# req and ack go through 2FF synchronizers (ndff); the data is captured under the
# enable 'cap' (mux_enable) and gets a data-stability check.
design:
  top: handshake_mux
  files: [handshake_mux.sv]
  params: {BAD: 0}

clocks:
  - {name: a, port: clk_a}
  - {name: b, port: clk_b}
resets:
  - {port: rst_a_n, active: low, clock: a}
  - {port: rst_b_n, active: low, clock: b}
inputs:
  - {port: go, clock: a}
  - {port: din, clock: a}

options:
  time_models: [ticks, clk2ff]

variants:
  base:
    expect:
      en_u_tx_data__u_rx_data_out: proven
      hs_u_tx_req: proven
      "u_tx.data->u_rx.data_out": safe
      "u_tx.req->u_req_sync.s1": safe
      "u_rx.ack->u_ack_sync.s1": safe
  data_changes:
    params: {BAD: 1}
    expect:
      en_u_tx_data__u_rx_data_out: cex
      hs_u_tx_req: proven
      "u_tx.data->u_rx.data_out": unsafe
      "u_tx.req->u_req_sync.s1": safe
      "u_rx.ack->u_ack_sync.s1": safe
