# Author: Shchuchkin E. Yu. <shchuchkin-pkims@yandex.ru>
# Example: pulse width across a 2FF synchronizer (T-PULSE) with clock periods.
design:
  top: pulse_sync
  files: [pulse_sync.sv]
  params: {HOLD: 8}

clocks:
  - {name: a, port: clk_a, period: 4}
  - {name: b, port: clk_b, period: 10}
resets:
  - {port: rst_a_n, active: low, clock: a}
  - {port: rst_b_n, active: low, clock: b}
inputs:
  - {port: stim, clock: a}

options:
  time_models: [ticks, clk2ff]
  clock_ratio: periods
  pulse_checks: true

variants:
  base:
    expect: {pulse_lvl__u_sync_s1: proven, "lvl->u_sync.s1": safe}
  short:
    params: {HOLD: 1}
    expect: {pulse_lvl__u_sync_s1: cex, "lvl->u_sync.s1": unsafe}
  free_clocks:                # without the clock ratio even HOLD = 8 can be missed
    options: {clock_ratio: free}
    expect: {pulse_lvl__u_sync_s1: cex, "lvl->u_sync.s1": unsafe}
