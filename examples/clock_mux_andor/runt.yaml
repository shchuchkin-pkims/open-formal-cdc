# Author: Shchuchkin E. Yu. <shchuchkin-pkims@yandex.ru>
# Plain clock mux: no AND/OR protocol is inferred and a runt pulse is found.
design:
  top: cdc010_leg_synced_select_runt
  files: [runt_mux.sv]

clocks:
  - {name: clk0, port: clk0}
  - {name: clk1, port: clk1}
  - {name: cs, port: cs}
resets:
  - {port: rst0, active: low}
  - {port: rst1, active: low}
inputs:
  - {port: sel_d, clock: cs}

options:
  structural: true
  clock_mux_checks: true
  time_models: [clk2ff]
  reset_steps: 30
  cover_depth: 80
  prove_engine: aiger rIC3
  timeout: 120

variants:
  base:
    expect: {clock_mux_clk_out: cex, "s_s->clk_out": unsafe}
