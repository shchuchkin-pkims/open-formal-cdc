# Author: Shchuchkin E. Yu. <shchuchkin-pkims@yandex.ru>
# Example: Gray pointer crossing. Crossings and checks are found automatically:
# the 2FF bus synchronizer is recognized (ndff_bus) and gets a Gray check on its source.
design:
  top: gray_sync
  files: [gray_sync.sv]
  params: {MODE: 0}

clocks:
  - {name: a, port: clk_a}
  - {name: b, port: clk_b}
resets:
  - {port: rst_a_n, active: low, clock: a}
  - {port: rst_b_n, active: low, clock: b}
inputs:
  - {port: inc, clock: a}

options:
  time_models: [ticks, clk2ff]
  meta_checks: true           # T-META with the metastability model on the first stage
  msi_ablate: true            # also prove each T-META check without the MSI model

variants:
  base:
    expect: {gray_u_tx_ptr: proven, meta_u_tx_ptr: proven, "u_tx.ptr->u_sync.s1": safe}
  binary:
    params: {MODE: 1}
    expect: {gray_u_tx_ptr: cex, meta_u_tx_ptr: cex, "u_tx.ptr->u_sync.s1": unsafe}
  step2:
    params: {MODE: 2}
    expect: {gray_u_tx_ptr: cex, meta_u_tx_ptr: cex, "u_tx.ptr->u_sync.s1": unsafe}
